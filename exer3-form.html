<html>
<head>
    <title>Contact Form</title>
    <link rel="stylesheet" href="css/form-style.css">
</head>
<body>
    <div class="main-container">
        <div class="profile-card">
        <h1>Contact Form</h1>
            <form action="https://formsubmit.co/ef3673361b8272f4eab825217f27f27c" method="POST">
                <label>
                    Name
                </label><input type="text" name="name" required>
                <label>
                    Email
                </label><input type="email" name="email" required>
                <label>
                    Message
                </label><textarea name="message" required></textarea>
                <br><button type="submit">Send</button>
            </form>
        </div>
    </div>
</body>
</html>
